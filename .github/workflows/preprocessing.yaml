name: Data Preprocessing Pipeline

on:
  push:
    paths:
      - '*.csv'
      - 'preprocessing/automate_*.py'
  workflow_dispatch:

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Run Preprocessing Script
        run: python preprocessing/automate_Nur_Kholis_Yusuf_Rabbani.py

      - name: Commit and Push Processed Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Menyimpan hasil yang ada di dalam folder preprocessing
          git add preprocessing/StudentPerformanceFactors_preprocessing.csv
          git commit -m "Auto-update: Preprocessed data terbaru" || echo "Tidak ada perubahan data"
          git push